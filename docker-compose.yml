services:
  catan:
    build: .
    image: catan:latest
    container_name: catan
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CATAN_ADDR: 0.0.0.0:8080
      CATAN_DATA_DIR: /data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

name: 🚀 Build & Deploy to Hetzner VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/ukirdeomkar/catan-game
  DUCKDNS_SUBDOMAIN: playcatanou

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Hetzner VPS via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            mkdir -p /root/catan
            cd /root/catan

            cat << 'EOF' > .env
            DUCKDNS_SUBDOMAIN=${{ env.DUCKDNS_SUBDOMAIN }}
            DUCKDNS_TOKEN=${{ secrets.DUCKDNS_TOKEN }}
            EOF

            cat << 'EOF' > docker-compose.yml
            services:
              catan:
                image: ghcr.io/ukirdeomkar/catan-game:latest
                container_name: catan
                restart: unless-stopped
                ports:
                  - "8080:8080"
                environment:
                  CATAN_ADDR: 0.0.0.0:8080
                  CATAN_DATA_DIR: /data
                volumes:
                  - ./data:/data
                healthcheck:
                  test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
                  interval: 30s
                  timeout: 3s
                  retries: 3

              duckdns:
                image: linuxserver/duckdns:latest
                container_name: catan_duckdns
                restart: unless-stopped
                environment:
                  SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
                  TOKEN: ${DUCKDNS_TOKEN}
                  TZ: UTC
            EOF

            mkdir -p data
            chown 10001:10001 data
            docker compose pull catan
            docker compose up -d
            docker image prune -f
